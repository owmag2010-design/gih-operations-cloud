# Run database tasks against the production database from GitHub, so the owner
# connection string lives only in GitHub secrets (never in Vercel or chat).
#
# Repository secret required: MIGRATION_DATABASE_URL (Supabase owner connection,
# the "Session pooler" string with the postgres user and database password).
# Repository variable: APP_URL (e.g. https://gih-operations-cloud.vercel.app).
name: Database

on:
  # Database changes apply themselves when they reach these branches.
  push:
    branches: [main, release-2-proposals]
    paths: ["drizzle/**", "scripts/seed.ts", "scripts/seed-lib.ts", "data/config/**", ".github/workflows/database.yml"]
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [migrate-and-seed, migrate, create-admin, reset-mfa]
        default: migrate-and-seed
      admin_email:
        description: "create-admin / reset-mfa: the person's email"
        required: false
      admin_name:
        description: "create-admin only: full name"
        required: false

permissions:
  contents: read

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  database:
    runs-on: ubuntu-latest
    environment: production
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      APP_URL: ${{ vars.APP_URL }}
      DOTENV_PATH: /dev/null
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate
        if: github.event_name == 'push' || (inputs.task != 'create-admin' && inputs.task != 'reset-mfa')
        run: npx tsx scripts/migrate.ts
      - name: Seed configuration
        if: github.event_name == 'push' || inputs.task == 'migrate-and-seed'
        run: npx tsx scripts/seed.ts
      - name: Create administrator
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'create-admin'
        env:
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          ADMIN_NAME: ${{ inputs.admin_name }}
        run: npx tsx scripts/create-admin.ts --email "$ADMIN_EMAIL" --name "$ADMIN_NAME" --firm-admin-all
      - name: Reset two-step sign-in
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'reset-mfa'
        env:
          ADMIN_EMAIL: ${{ inputs.admin_email }}
        run: npx tsx scripts/reset-mfa.ts --email "$ADMIN_EMAIL"
